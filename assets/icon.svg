<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4338CA" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Inner Subtle Border -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Central Badge - Clock / Check / 1 Min -->
  <!-- Outer Clock Ring -->
  <circle cx="256" cy="246" r="140" fill="rgba(255,255,255,0.12)" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
  
  <!-- Minute Progress Arc (60s tick) -->
  <circle cx="256" cy="246" r="140" fill="none" stroke="#FDE047" stroke-width="16" stroke-dasharray="880" stroke-dashoffset="660" stroke-linecap="round" />

  <!-- Korean '1분' Typography & Checkmark -->
  <text x="256" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">딱1분</text>
  
  <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-weight="700" font-size="34" fill="#FDE047" text-anchor="middle" letter-spacing="1">맞춤법 퀴즈</text>

  <!-- Flame Badge at Bottom Right -->
  <g transform="translate(325, 315) scale(0.75)">
    <circle cx="80" cy="80" r="75" fill="#1E1B4B" />
    <path d="M80 18 C80 18, 98 46, 98 68 C98 84, 88 98, 80 110 C72 98, 62 84, 62 68 C62 46, 80 18, 80 18 Z" fill="url(#flameGrad)" />
    <path d="M80 50 C80 50, 90 68, 90 80 C90 92, 84 98, 80 105 C76 98, 70 92, 70 80 C70 68, 80 50, 80 50 Z" fill="#FDE047" />
  </g>
</svg>
